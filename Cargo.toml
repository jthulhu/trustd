[workspace]
resolver = "3"
members = ["trustd", "libtrust", "zbus-trust"]

[workspace.metadata.crane]
name = "trust"

[workspace.package]
authors = ["jthulhu <jthulhu@2mon.ad>"]
edition = "2024"
repository = "https://github/jthulhu/trust"
license = "AGPL-3.0-or-later"
version = "1.0.0"

[workspace.dependencies]
zbus = "6.2.1"
zbus-trust.path = "zbus-trust"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
futures-util = "0.3.34"
async-trait = "0.1.92"
